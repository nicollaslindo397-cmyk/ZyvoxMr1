# Versão do Gradle exigida pelo projeto.
#
# AGP 9.4 requer Gradle >= 9.6.0. Fixamos 9.8.2, que é a versão com que o próprio SceneView
# 4.65.0 é construído — usar uma versão diferente da biblioteca que consumimos é pedir por
# surpresa em comportamento de plugin.
#
# ATENÇÃO: este repositório NÃO versiona `gradle/wrapper/gradle-wrapper.jar` (é binário).
# Consequências práticas:
#
#   - `./gradlew` não funciona direto do clone. Para gerar o wrapper completo, rode uma vez:
#         gradle wrapper --gradle-version 9.8.2
#     (precisa de um Gradle instalado; o Android Studio também oferece isso).
#
#   - O Android Studio funciona sem o jar: ele usa o Gradle embutido e lê esta versão.
#
#   - O CI (.github/workflows/android-debug-apk.yml) usa `gradle/actions/setup-gradle`, que
#     instala o Gradle desta versão e expõe `gradle` no PATH — também não precisa do jar.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
