# Catálogo de versões do Zyvox MR.
#
# Os pins foram escolhidos a partir do conjunto com que o próprio SceneView 4.65.0 é
# compilado e publicado. Isso não é conservadorismo: o AAR do SceneView declara
# `minCompileSdk = 37` e bytecode Java 21 com funções `inline` públicas, então um
# compileSdk menor ou um jvmTarget menor falha — e falha de um jeito confuso, apontando
# para classes do Kotlin stdlib em vez de apontar para a causa real.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"

# Renderização 3D (Filament por baixo). Usamos o módulo `sceneview`, não o `arsceneview`:
# esta arquitetura é CameraX + sensor de rotação (3DoF), sem ARCore.
sceneview = "4.65.0"

# Passthrough e análise de imagem. 1.6.2 é o stable corrente (ago/2026).
camerax = "1.6.2"

# Hand tracking. 0.10.26 é o piso: versões anteriores embarcam `.so` com segmentos ELF
# alinhados em 4 KB, o que é rejeitado em aparelhos com page size de 16 KB (Android 15+).
mediapipeTasksVision = "0.10.26"

composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.10.0"
coroutines = "1.11.0"

junit = "4.13.2"

[libraries]
# Viewport 3D + ViewNode (Compose/View dentro da cena) + Filament transitivo.
sceneview = { module = "io.github.sceneview:sceneview", version.ref = "sceneview" }

# Passthrough: Preview desenha a câmera traseira; ImageAnalysis entrega os quadros YUV
# que alimentam o MediaPipe; Lifecycle liga a câmera ao ciclo da Activity.
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# EXCLUÍMOS `com.google.auto.value:auto-value` de propósito: o POM do MediaPipe o declara
# como dependência de runtime, mas o AutoValue é só de compilação e arrasta um JavaPoet
# sombreado que referencia classes `javax.lang.model.**` (compile-time-only do JDK).
# Com R8 em modo full isso vira erro duro na compilação da build release.
mediapipe-tasks-vision = { module = "com.google.mediapipe:tasks-vision", version.ref = "mediapipeTasksVision" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
