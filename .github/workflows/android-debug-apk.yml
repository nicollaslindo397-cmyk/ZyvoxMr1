# ─── Por que este workflow existe ───────────────────────────────────────────────
# Compilar um APK exige JDK 21, Gradle 9.x e o Android SDK (compileSdk 37).
# Este é o único caminho do projeto que produz um APK instalável: os runners do GitHub têm
# rede e toolchain, e o artefato sai pronto para download.
#
# Onde baixar o APK depois do push:
#   aba "Actions" → run mais recente de "Build debug APK" → seção "Artifacts" no fim da
#   página → `zyvox-mr-debug-apk`.
#
# O artefato do GitHub vem zipado. Para instalar direto no aparelho:
#   unzip zyvox-mr-debug-apk.zip && adb install -r app-debug.apk
#
# ─── Por que os passos de Gradle têm todo aquele cerimonial de log ────────────────────────
# Os logs de step do GitHub ficam num host de blob storage separado, que não é legível de fora
# do runner. As ANNOTATIONS (`::error::`, `::warning::`) ficam na API normal e são legíveis:
#   gh api repos/<dono>/<repo>/check-runs/<job-databaseId>/annotations
# Seis corridas seguidas foram diagnosticadas às cegas por causa disso — cada uma custava um
# ciclo inteiro e a mensagem real do Gradle nunca chegava. Então cada passo de Gradle aqui
# captura a saída e, em falha, a republica como annotations. Ver `_anotar-log.sh`.

name: Build debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Um push novo cancela o build do commit anterior: compilar Android leva ~10 min e não faz
# sentido gastar runner num commit que já foi substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` é o que permite ao job publicar o APK como asset de Release. Sem isto o
# `GITHUB_TOKEN` é somente-leitura para conteúdo e o passo de Release falha com 403.
permissions:
  contents: write

jobs:
  build:
    name: assembleDebug + testes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # JDK 21 é obrigatório, não opcional: o AAR do SceneView 4.65.0 publica bytecode
      # Java 21 com `inline` functions públicas. Com JDK 17 o build falha apontando para
      # classes do Kotlin stdlib, o que é confuso de diagnosticar.
      #
      # v5 e não v4: o runner avisa que "setup-java v4 is deprecated and will no longer
      # receive updates".
      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # O repo não versiona `gradle/wrapper/gradle-wrapper.jar` (binário, e não há como
      # baixá-lo no ambiente onde este projeto foi escrito). Então não usamos `./gradlew`:
      # esta action instala o Gradle da versão declarada em
      # gradle/wrapper/gradle-wrapper.properties e disponibiliza `gradle` no PATH.
      #
      # v4 e não v3: v3 instala o JDK 17 por padrão, e o SceneView precisa de 21.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Publica o helper que os passos de Gradle usam para transformar log em annotation.
      # Fica no workspace (fora do repo) para não virar arquivo versionado.
      - name: Criar helper de diagnóstico
        run: |
          cat > "$RUNNER_TEMP/_anotar-log.sh" <<'HELPER'
          #!/usr/bin/env bash
          # Republica o fim de um log de build como annotations do GitHub.
          #
          # Motivo: os logs de step ficam num host de blob storage que não é legível de fora do
          # runner, enquanto `::error::`/`::notice::` chegam à API de annotations. Sem isto, uma
          # falha de build aqui é invisível para quem está do lado de fora e cada tentativa vira
          # um chute.
          #
          # Uso: _anotar-log.sh <arquivo-de-log> <rótulo-do-passo>
          LOG="$1"
          LABEL="${2:-build}"
          [ -f "$LOG" ] || { echo "log ausente: $LOG"; exit 0; }

          # `::error::` é limitado a uma linha por annotation, e um erro de compilação Kotlin
          # típico ocupa várias. Então vamos de `::notice::` com aspas dobradas (que o parser do
          # runner aceita como multilinha) — o nível importa menos que o conteúdo chegar.
          #
          # 400 linhas e não o log inteiro: annotation tem teto de tamanho, e o que interessa
          # num build quebrado está no fim (a primeira causa e o resumo "FAILURE:").
          BODY="$(tail -n 400 "$LOG")"
          BODY="${BODY//'%'/'%25'}"
          BODY="${BODY//$'\n'/'%0A'}"
          BODY="${BODY//$'\r'/'%0D'}"

          # A causa raiz costuma estar ANTES do resumo final, então também pescamos as linhas que
          # o próprio Gradle marca como erro. Quando existem, elas são a coisa mais útil do log.
          RAIZ="$(grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|> Task .* FAILED" "$LOG" | tail -n 60 || true)"
          if [ -n "$RAIZ" ]; then
            RAIZ_ENC="${RAIZ//'%'/'%25'}"
            RAIZ_ENC="${RAIZ_ENC//$'\n'/'%0A'}"
            RAIZ_ENC="${RAIZ_ENC//$'\r'/'%0D'}"
            echo "::error title=$LABEL — linhas que o Gradle marcou como erro::%0A$RAIZ_ENC"
          fi

          echo "::notice title=$LABEL — fim do log::%0A$BODY"
          HELPER
          chmod +x "$RUNNER_TEMP/_anotar-log.sh"

      # ─── Por que NÃO há passo de instalação do Android SDK ────────────────────────────
      # Houve um aqui, e era ele que quebrava o build.
      #
      # Duas versões desse passo falharam no mesmo ponto — uma com `sdkmanager` chamado à
      # mão, outra com `android-actions/setup-android@v3` — ambas tentando instalar
      # `platforms;android-37`. A evidência de que o passo era o problema, e não a solução,
      # vem do CI do próprio SceneView (`.github/workflows/ci.yml` e `build-apks.yml`, na
      # tag v4.65.0): aqueles workflows rodam `assembleDebug` com `compileSdk 37` em
      # `ubuntu-latest` e não contêm NENHUMA menção a `setup-android`, `sdkmanager`,
      # `platforms;` ou `build-tools;`. Eles deixam o AGP resolver o SDK durante o build.
      #
      # Confirmado por annotation desta corrida: o runner tem
      # `ANDROID_HOME=/usr/local/lib/android/sdk` e `platforms/android-37` NÃO está lá antes do
      # build — e ainda assim o SceneView compila. Ou seja, o AGP baixa o que falta.

      # Diagnóstico barato e à prova de falha: nada aqui derruba o job. Se o SDK não estiver
      # pronto, quem vai dizer isso é o Gradle, com a mensagem real (que o helper acima torna
      # legível).
      - name: Conferir toolchain
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "── java ──"; java -version 2>&1 || true
          echo "── gradle ──"; gradle --version 2>&1 | head -8 || true
          echo "── ANDROID_HOME='${ANDROID_HOME:-<vazio>}'  SDK_ROOT=$SDK_ROOT ──"
          echo "── platforms instaladas ──"
          ls -1 "$SDK_ROOT/platforms" 2>&1 || echo "  (diretório ausente)"
          echo "── build-tools instalados ──"
          ls -1 "$SDK_ROOT/build-tools" 2>&1 || echo "  (diretório ausente)"
          echo "── licenças aceitas ──"
          ls -1 "$SDK_ROOT/licenses" 2>&1 || echo "  (diretório ausente)"

          if [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            # Aviso, não erro. Uma versão anterior terminava em `exit 1` aqui, e isso era
            # justamente o que impedia o AGP de baixar a plataforma: a guarda matava o job antes
            # de o mecanismo de recuperação ter chance de rodar.
            echo "::warning::platforms/android-37 ainda ausente em $SDK_ROOT; o AGP deve baixá-la durante o build."
          else
            echo "OK: platform 37 já presente."
          fi

      # ─── Passos de Gradle ────────────────────────────────────────────────────────────────
      # `--continue` faz o Gradle reportar TODAS as falhas de uma vez em vez de parar na
      # primeira. Sem compilador local disponível, cada corrida aqui é o único feedback
      # possível; descobrir um erro por vez custaria um ciclo inteiro por erro.
      #
      # `--stacktrace` porque uma falha na fase de configuração (script de build quebrado) se
      # manifesta como erro na tarefa pedida e não menciona o script — foi exatamente assim que
      # uma referência a `org.jetbrains.kotlin.gradle.dsl.JvmTarget` sem o KGP no classpath
      # apareceu como falha em `:app:fetchHandModel`.

      # O `hand_landmarker.task` é baixado pela tarefa `fetch<Variant>HandModel` do próprio
      # build, registrada por variant via `androidComponents.onVariants` — então NÃO existe mais
      # uma tarefa chamada `fetchHandModel`, e pedir `:app:fetchHandModel` falha com
      # "task not found" em vez de baixar o modelo.
      #
      # Rodá-la primeiro separa "a rede falhou" de "o código não compila", que são dois problemas
      # com donos diferentes. Sem isto, uma falha de download apareceria dentro do
      # `assembleDebug`, misturada com erros de compilação.
      - name: Baixar modelo do MediaPipe
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/fetch-model.log"
          gradle --no-daemon --continue --stacktrace :app:fetchDebugHandModel 2>&1 | tee "$LOG"
        shell: bash

      - name: Testes unitários
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/test.log"
          gradle --no-daemon --continue --stacktrace :app:testDebugUnitTest 2>&1 | tee "$LOG"
        shell: bash

      - name: Montar APK debug
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/assemble.log"
          gradle --no-daemon --continue --stacktrace :app:assembleDebug 2>&1 | tee "$LOG"
        shell: bash

      # Roda em falha e ANTES dos uploads: é este passo que torna a falha diagnosticável de
      # fora do runner. `if: always()` porque um passo anterior pode ter abortado o job.
      - name: Publicar log de build (em falha)
        if: failure()
        run: |
          A="$RUNNER_TEMP/_anotar-log.sh"
          [ -x "$A" ] || { echo "helper ausente"; exit 0; }
          for par in "fetch-model.log:fetchHandModel" "test.log:testDebugUnitTest" "assemble.log:assembleDebug"; do
            ARQ="${par%%:*}"; ROT="${par##*:}"
            if [ -f "$RUNNER_TEMP/$ARQ" ]; then
              echo "### anotando $ROT"
              bash "$A" "$RUNNER_TEMP/$ARQ" "$ROT" || true
            fi
          done
        shell: bash

      # Publica o APK. `if-no-files-found: error` faz o job falhar em vez de passar em
      # branco caso o caminho mude — um artifact vazio que "funcionou" é pior que um erro.
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: zyvox-mr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── APK direto, sem zip e sem adb ────────────────────────────────────────────────────
      #
      # O artifact acima só é baixável logado e vem em zip, o que no navegador do celular é um
      # caminho ruim. Aqui o mesmo APK vira asset de Release, que é um arquivo .apk direto.
      #
      # A tag é FIXA (`apk-latest`) e o asset tem nome fixo, então a URL de download nunca muda:
      #   https://github.com/nicollaslindo397-cmyk/ZyvoxMr1/releases/download/apk-latest/zyvox-mr-debug.apk
      # Cada build substitui o asset (`--clobber`). O preço é não haver histórico de APKs por
      # build — aceitável, porque o histórico de código já está nas tags de commit e nos
      # artifacts (30 dias), e o que se quer aqui é "o APK atual num link que não muda".
      #
      # `if: github.event_name == 'push'`: num pull_request o GITHUB_TOKEN é somente-leitura
      # mesmo com `permissions`, e publicar o APK de um PR como "o APK" seria enganoso.
      - name: Publicar APK na Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          TAG="apk-latest"

          gh release create "$TAG" \
            --title "APK debug (último build)" \
            --notes "Build de \`${GITHUB_SHA}\`. Este asset é substituído a cada build verde." \
            --target "$GITHUB_SHA" 2>/dev/null || true

          # A nota é atualizada sempre, mesmo quando a Release já existia: sem isto ela ficaria
          # apontando para o commit do dia em que a tag foi criada, o que é pior que não dizer.
          gh release edit "$TAG" \
            --notes "Build de \`${GITHUB_SHA}\` · [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"

          gh release upload "$TAG" "$APK#zyvox-mr-debug.apk" --clobber
          echo "APK publicado: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/zyvox-mr-debug.apk"

      # Os logs completos, para quando as annotations não bastarem.
      - name: Publicar relatórios e logs (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            ${{ runner.temp }}/fetch-model.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/assemble.log
          if-no-files-found: ignore
          retention-days: 14
