# ─── JVM / Gradle ─────────────────────────────────────────────────────────────
# SceneView publica bytecode Java 21 com `inline` functions públicas: o módulo app
# precisa compilar com JVM target 21, e isso por sua vez exige um JDK 21+ rodando o Gradle.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache desligado de propósito: o build tem uma tarefa `Exec` que baixa o
# modelo do MediaPipe (ver app/build.gradle). Manter o cache desligado evita uma classe
# inteira de falhas de "task não serializável" em troca de alguns segundos de build.
org.gradle.configuration-cache=false

# ─── AndroidX ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true

# ─── Kotlin embutido do AGP 9: por que NÃO há flags aqui ──────────────────────────────────
# O SceneView 4.65.0 traz `android.builtInKotlin=false` e `android.newDsl=false` no
# gradle.properties dele, e aplicar essas duas flags aqui foi tentado. Não é o nosso caso:
#
#   * O motivo deles é específico da biblioteca — binary-compatibility-validator 0.18.x e o
#     detekt se registram por plugin id ("kotlin-android"), e sob o Kotlin embutido o AGP não
#     aplica plugin id nenhum, só um `KotlinBaseApiPlugin` interno. Resultado: `apiCheck` sai
#     verde sem validar nada. Este projeto não usa nenhuma das duas ferramentas, então o
#     motivo não se aplica.
#   * As duas flags são pareadas, e `newDsl=false` volta o projeto para a DSL antiga do AGP.
#     O `app/build.gradle.kts` usa blocos da DSL nova — `androidResources { noCompress }`,
#     `experimentalProperties[...]`, `splits { abi { isEnable } }`. Trocar de DSL para resolver
#     um import quebrado seria trocar um erro de compilação por vários.
#
# Então ficamos no padrão do AGP 9: Kotlin embutido, DSL nova. A consequência é que o script
# de build NÃO PODE referenciar `org.jetbrains.kotlin.gradle.dsl.JvmTarget` — essa classe vem
# do Kotlin Gradle Plugin, que não está no classpath neste modo. O JVM target 21 é expresso por
# `compileOptions`, que o Kotlin embutido respeita.

# ─── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official
